name: Generate Profile Views Card

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch count and generate SVG
        run: |
          BADGE=$(curl -sL "https://komarev.com/ghpvc/?username=thevikramrajput")
          COUNT=$(echo "$BADGE" | grep -oP '(?<=>)\d+(?=<)' | tail -1)
          [ -z "$COUNT" ] && COUNT="0"
          echo "Profile views: $COUNT"

          mkdir -p dist
          cat > dist/profile-views-card.svg << SVGEOF
          <svg xmlns="http://www.w3.org/2000/svg" width="300" height="195" viewBox="0 0 300 195">
            <rect width="300" height="195" rx="4.5" fill="#0d1117"/>
            <g transform="translate(150, 28)">
              <path d="M-4,-10 C0,-14 4,-14 6,-10 L8,-6 C8,-6 4,-2 0,4 C-4,-2 -8,-6 -8,-6 L-6,-10 Z" fill="#EA2E00" transform="scale(1.1)"/>
            </g>
            <circle cx="150" cy="90" r="40" fill="none" stroke="#EA2E00" stroke-width="5" stroke-linecap="round"/>
            <text x="150" y="100" fill="#F0E7D6" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="30" text-anchor="middle" font-weight="700">${COUNT}</text>
            <text x="150" y="155" fill="#F0E7D6" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="16" text-anchor="middle" font-weight="700">Profile Views</text>
            <text x="150" y="180" fill="#9DBDB8" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="12" text-anchor="middle">All Time</text>
          </svg>
          SVGEOF

      - name: Deploy to output branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: output
